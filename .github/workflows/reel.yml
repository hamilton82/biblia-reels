name: Reel biblia

on:
  schedule:
    - cron: "0 13,17,22,1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.paginas.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar reel
        run: python generar.py --nombre reel

      - name: Subir estado del versiculo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "estado versiculo $(date -u +%F)"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir video a Pages
        id: paginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: media

      - name: Publicar Pages
        uses: actions/deploy-pages@v4

      - name: Esperar a que el video este en linea
        run: |
          URL="${{ steps.paginas.outputs.page_url }}reel.mp4"
          echo "URL=$URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "video en linea"; exit 0; fi
            echo "esperando... ($CODE)"
            sleep 10
          done
          echo "el video no se publico a tiempo"
          exit 1

      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VIDEO_URL: ${{ steps.paginas.outputs.page_url }}reel.mp4
        run: |
          export CAPTION="$(cat build/caption.txt)"
          python publicar.py
